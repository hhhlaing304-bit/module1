<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }
    .card-box{
        background-color: gray;
        padding: 25px;
        width: 220px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
    }
    h3{
        color: white;
        margin-top: 0;

    }
    .icon-box{
        width: 60px;
        height: 60px;
        background-color: blue;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 20px 0;

    }
    @keyframes fadeIn{
        from{
            opacity: 0;
            transform: translateY(20px);

        }
        to{
            opacity: 1;
            transform: translateY(0);
        }

    }
    .anim-fade-in{
        animation: fadeIn 2s infinite alternate;
    }

    @keyframes pulse{
        0%{
            transform: scale(1);
        }
        50%{
            transform: scale(1.5);
        }
        100%{
            transform: scale(1);
        }
    }
    .heart{
        animation: pulse 1.2s infinite ;
    }

</style>
<body>
    <div class="container">
        <div class="card-box">
            <h3>Fade</h3>
            <div class="icon-box anim-fade-in">Fade</div>
        </div>
        <div class="card-box ">
            <h3>Plus</h3>
            <div class="icon-box heart">Puls</div>
        </div>
        <div class="card-box">
            <h3>Okay</h3>
            <div class="icon-box">ok</div>
        </div>
        <div class="card-box">
            <h3>circle</h3>
            <div class="icon-box"></div>
        </div>
        <div class="card-box">
            <h3>HaHa</h3>
            <div class="icon-box">!</div>
        </div>
    </div>
</body>
</html>
